[package]
name = "app-status-tracker"
version = "0.4.0"
description = "Tray utility that watches vendor status pages"
authors = ["Jason Suttles"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what Tauri's mobile/desktop entry points share.
[lib]
name = "app_status_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `macos-private-api`, deliberately: the panel is opaque. Transparency on
# macOS needs that feature *and* `app.macOSPrivateApi` in tauri.conf.json, fails
# silently with only one of them, and rules out the Mac App Store. A list of
# statuses doesn't need to float, so the whole trap is avoided rather than
# guarded.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Driven from Rust only (`open_url` in lib.rs), so JavaScript gets no opener
# permission and no scope to get wrong.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# TLS is the OS's own (`native-tls`): SChannel on Windows, Security.framework
# on macOS, OpenSSL on Linux. The OS certificate store is what makes a corporate
# proxy that re-signs TLS with its own root CA work, and SChannel needs no C
# toolchain to build, unlike the default (aws-lc-rs). The connectivity probes
# share the crate but refuse https on purpose (see probe.rs). `system-proxy` so
# requests go where the browser's go on a network that requires a proxy.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }

# One copy of the app, ever. A second launch (a double-click on the shortcut,
# launch-at-login plus a manual start) would otherwise mean two tray icons,
# every page polled twice, two popups for one outage, and two writers racing on
# settings.json's temp file. The second copy hands off to the first and exits.
# Desktop-only: the plugin doesn't build for mobile targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
serde_json = "1"

[features]
# This feature is used by the CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Optimize hard for the "ultra-lightweight, runs all day" goal.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
