<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
  role="img" aria-label="App Status Tracker">
  <title>App Status Tracker (small)</title>
  <desc>The same mark, redrawn for 16–32px: one fat ring, a larger dot, no faded outer ring.</desc>

  <!--
    Hand-tuned for the tray and the taskbar. At 16px the full master's faded
    outer ring is a one-pixel smear and the gap between rings closes up, so this
    variant drops the outer ring, fattens the inner one and enlarges the dot
    until the two still read as separate shapes.

    Keep it in sync with icon.svg when the design changes: it is the same icon,
    simplified, not a different one.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3555" />
      <stop offset="1" stop-color="#12141b" />
    </linearGradient>

    <linearGradient id="ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93b3ff" />
      <stop offset="1" stop-color="#4f7cf0" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)" />

  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="64" />

  <circle cx="256" cy="256" r="84" fill="#5ecf8d" />
</svg>
